<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19110b"/>
      <stop offset="0.52" stop-color="#2b1a0f"/>
      <stop offset="1" stop-color="#080605"/>
    </linearGradient>
    <radialGradient id="barGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#a86b32" stop-opacity="0.42"/>
      <stop offset="0.58" stop-color="#2c1a10" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#050403" stop-opacity="0.78"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#barGlow)"/>
  <g opacity="0.18">
    <rect x="0" y="760" width="1080" height="320" fill="#0b0604"/>
    <rect x="80" y="775" width="920" height="20" rx="10" fill="#b06b34"/>
    <rect x="0" y="816" width="1080" height="16" fill="#000000"/>
  </g>
  <g opacity="0.18" stroke="#f2c36b" stroke-width="2">
    <path d="M70 210h940"/>
    <path d="M88 880h904"/>
    <path d="M150 146h780"/>
  </g>

  <rect x="54" y="54" width="972" height="972" rx="38" fill="none" stroke="#c78a3d" stroke-width="8"/>
  <rect x="76" y="76" width="928" height="928" rx="28" fill="none" stroke="#f4d59b" stroke-opacity="0.26" stroke-width="2"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="540" y="145" fill="#f8dfaa" font-size="86" font-weight="900" letter-spacing="0">Cup Matchup</text>
    <text x="540" y="188" fill="#f0bd6a" font-size="28" font-weight="700" letter-spacing="0">Actual drinking cups. Not that other thing.</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="92" y="246" width="340" height="68" rx="10" fill="#c53226"/>
    <text x="262" y="291" text-anchor="middle" fill="#fff4dc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900">WATCH EVERY GAME</text>
  </g>

  <g filter="url(#shadow)">
    <image href="{{cup1}}" x="142" y="326" width="330" height="392" preserveAspectRatio="xMidYMid meet"/>
    <image href="{{cup2}}" x="608" y="326" width="330" height="392" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="540" y="540" fill="#ffffff" font-size="66" font-weight="900">VS</text>
    <rect x="458" y="560" width="164" height="8" rx="4" fill="#c78a3d"/>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="306" y="780" fill="#fff3df" font-size="{{country1Font}}">{{country1}}</text>
    <text x="774" y="780" fill="#fff3df" font-size="{{country2Font}}">{{country2}}</text>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="540" y="884" fill="#f9e7be" font-size="54" font-weight="900">Malone's Pub</text>
    <text x="540" y="932" fill="#f0bd6a" font-size="28" font-weight="800">COLD BEER / FULL BAR / BIG SCREENS</text>
    <text x="540" y="972" fill="#fff3df" font-size="26" font-weight="700">DOWNTOWN FORT WORTH</text>
  </g>
</svg>
